<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assistente MCP — Gestione dispositivi Android</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef1f6;
      --bg-gradient: radial-gradient(1200px 600px at 50% -10%, #e8ecf9 0%, #eef1f6 55%);
      --panel: #ffffff;
      --panel-alt: #f8f9fc;
      --text: #161a23;
      --muted: #6b7280;
      --muted-soft: #9aa2b1;
      --border: #e3e6ef;
      --border-soft: #edeff5;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft: #eef0fe;
      --user-bubble-from: #4f46e5;
      --user-bubble-to: #6d5bf1;
      --assistant-bubble: #f2f3f8;
      --danger: #b42318;
      --danger-bg: #fef3f2;
      --danger-border: #f6cdc7;
      --warn-bg: #fff6e8;
      --warn-border: #f3d8a0;
      --warn-text: #8a5a00;
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.06);
      --shadow-md: 0 8px 24px rgba(16, 24, 40, 0.08);
      --shadow-lg: 0 24px 48px -12px rgba(16, 24, 40, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-gradient), var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 760px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--panel);
      box-shadow: var(--shadow-lg);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      flex-wrap: wrap;
    }

    header .titles h1 {
      font-size: 16px;
      font-weight: 650;
      margin: 0;
      letter-spacing: -0.01em;
    }

    header .titles p {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: var(--muted);
    }

    .ghost-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .ghost-btn:hover {
      background: var(--panel-alt);
      border-color: #d4d8e4;
    }

    .ghost-btn:active {
      transform: scale(0.97);
    }

    .ghost-btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
    }

    #fakeBanner {
      display: none;
      align-items: center;
      gap: 10px;
      margin: 14px 24px 0;
      padding: 10px 14px;
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid var(--warn-border);
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
    }

    #fakeBanner.visible {
      display: flex;
    }

    #fakeBanner .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #d99400;
      flex: none;
      box-shadow: 0 0 0 3px rgba(217, 148, 0, 0.18);
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    #log::-webkit-scrollbar {
      width: 8px;
    }

    #log::-webkit-scrollbar-thumb {
      background: #d7dbe6;
      border-radius: 999px;
    }

    #log::-webkit-scrollbar-track {
      background: transparent;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .msg {
      max-width: 82%;
      display: flex;
      flex-direction: column;
      gap: 5px;
      animation: msgIn 0.28s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    .msg .msg-text {
      padding: 11px 15px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      line-height: 1.48;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg.user .msg-text {
      background: linear-gradient(135deg, var(--user-bubble-from), var(--user-bubble-to));
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: var(--shadow-sm);
    }

    .msg.assistant {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg.assistant .msg-text {
      background: var(--assistant-bubble);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .msg.system {
      align-self: center;
      align-items: center;
      max-width: 90%;
    }

    .msg.system .msg-text {
      background: transparent;
      color: var(--muted-soft);
      font-size: 12px;
      padding: 2px 8px;
      text-align: center;
    }

    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      font-weight: 600;
      color: var(--accent);
      background: var(--accent-soft);
      border: 1px solid #dcdcfb;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.01em;
    }

    form#composer {
      display: flex;
      gap: 10px;
      padding: 16px 24px 20px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel-alt);
      font-size: 14.5px;
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    }

    #input::placeholder {
      color: var(--muted-soft);
    }

    #input:focus {
      outline: none;
      border-color: var(--accent);
      background: var(--panel);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    #input:disabled {
      opacity: 0.6;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    #sendBtn {
      padding: 0 22px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: white;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      box-shadow: var(--shadow-sm);
    }

    #sendBtn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    #sendBtn:active:not(:disabled) {
      transform: scale(0.97);
    }

    #sendBtn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
    }

    #sendBtn:disabled,
    #input:disabled~#sendBtn {
      opacity: 0.55;
      cursor: not-allowed;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 18, 28, 0.5);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 10;
    }

    #overlay.visible {
      display: flex;
      animation: overlayIn 0.18s ease both;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    #confirmCard {
      background: var(--panel);
      border-radius: var(--radius-lg);
      max-width: 440px;
      width: 100%;
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
      animation: cardIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    #confirmCard h2 {
      font-size: 17px;
      font-weight: 650;
      margin: 0 0 6px;
      letter-spacing: -0.01em;
    }

    #confirmCard .risk {
      display: inline-block;
      margin-bottom: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--danger-bg);
      color: var(--danger);
      border: 1px solid var(--danger-border);
    }

    #confirmCard p.summary {
      font-size: 14.5px;
      line-height: 1.5;
      color: var(--text);
      margin: 0 0 24px;
    }

    .confirm-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .confirm-actions button {
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13.5px;
      font-weight: 600;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .confirm-actions button:active {
      transform: scale(0.97);
    }

    .confirm-actions button.reject {
      background: var(--panel-alt);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .confirm-actions button.reject:hover {
      background: #eceef4;
    }

    #approveBtn {
      background: var(--danger);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    #approveBtn:hover {
      background: #96190f;
    }

    #approveBtn:focus-visible,
    .confirm-actions button.reject:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(180, 35, 24, 0.18), 0 0 0 1px var(--danger);
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="titles">
        <h1>Assistente conversazionale — Device Management Android</h1>
        <p>Server MCP custom (scrittura) + server MCP ufficiale Google (lettura) + mock AMAPI</p>
      </div>
      <button id="resetBtn" type="button" class="ghost-btn">↺ Reimposta demo</button>
    </header>

    <div id="fakeBanner"><span class="dot"></span>Modalità demo senza LLM reale: le risposte sono simulate</div>

    <div id="log"></div>

    <form id="composer">
      <input id="input" type="text" placeholder="Es. elenca i dispositivi, blocca il device pixel-8-support-02..."
        autocomplete="off" />
      <button id="sendBtn" type="submit">Invia</button>
    </form>
  </main>

  <div id="overlay">
    <div id="confirmCard">
      <span class="risk" id="riskBadge">RISCHIO</span>
      <h2>Conferma richiesta</h2>
      <p class="summary" id="summaryText"></p>
      <div class="confirm-actions">
        <button class="reject" id="rejectBtn" type="button">Annulla</button>
        <button id="approveBtn" type="button">Conferma azione</button>
      </div>
    </div>
  </div>

  <script>
    const BACKEND = ""; // stessa origine del backend FastAPI che serve questa pagina
    let sessionId = null;
    let pendingActionId = null;

    const log = document.getElementById("log");
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const overlay = document.getElementById("overlay");
    const summaryText = document.getElementById("summaryText");
    const riskBadge = document.getElementById("riskBadge");
    const fakeBanner = document.getElementById("fakeBanner");
    const resetBtn = document.getElementById("resetBtn");

    function appendMessage(role, text, toolUsed) {
      const el = document.createElement("div");
      el.className = "msg " + role;

      const textEl = document.createElement("div");
      textEl.className = "msg-text";
      textEl.textContent = text;
      el.appendChild(textEl);

      if (toolUsed) {
        const badge = document.createElement("span");
        badge.className = "tool-badge";
        badge.textContent = toolUsed;
        el.appendChild(badge);
      }

      log.appendChild(el);
      log.scrollTop = log.scrollHeight;
    }

    function setBusy(busy) {
      sendBtn.disabled = busy;
      input.disabled = busy;
    }

    function showConfirm(pending) {
      pendingActionId = pending.action_id;
      summaryText.textContent = pending.summary;
      riskBadge.textContent = "Rischio " + pending.risk;
      overlay.classList.add("visible");
    }

    function hideConfirm() {
      pendingActionId = null;
      overlay.classList.remove("visible");
    }

    async function postJSON(path, body) {
      const res = await fetch(BACKEND + path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        const detail = await res.text();
        throw new Error(`HTTP ${res.status}: ${detail}`);
      }
      return res.json();
    }

    function handleResponse(data) {
      sessionId = data.session_id;
      if (data.reply) appendMessage("assistant", data.reply, data.tool_used);
      if (data.pending) {
        showConfirm(data.pending);
      }
    }

    form.addEventListener("submit", async (evt) => {
      evt.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      appendMessage("user", message);
      input.value = "";
      setBusy(true);
      try {
        const data = await postJSON("/chat", { session_id: sessionId, message });
        handleResponse(data);
      } catch (err) {
        appendMessage("system", "Errore: " + err.message);
      } finally {
        setBusy(false);
      }
    });

    document.getElementById("approveBtn").addEventListener("click", async () => {
      if (!pendingActionId) return;
      const actionId = pendingActionId;
      hideConfirm();
      setBusy(true);
      try {
        const data = await postJSON("/confirm", { session_id: sessionId, action_id: actionId, approve: true });
        handleResponse(data);
      } catch (err) {
        appendMessage("system", "Errore: " + err.message);
      } finally {
        setBusy(false);
      }
    });

    document.getElementById("rejectBtn").addEventListener("click", async () => {
      if (!pendingActionId) return;
      const actionId = pendingActionId;
      hideConfirm();
      setBusy(true);
      try {
        const data = await postJSON("/confirm", { session_id: sessionId, action_id: actionId, approve: false });
        handleResponse(data);
      } catch (err) {
        appendMessage("system", "Errore: " + err.message);
      } finally {
        setBusy(false);
      }
    });

    resetBtn.addEventListener("click", async () => {
      setBusy(true);
      resetBtn.disabled = true;
      try {
        await postJSON("/demo/reset", { session_id: sessionId });
      } catch (err) {
        appendMessage("system", "Errore durante il reset: " + err.message);
      } finally {
        sessionId = null;
        hideConfirm();
        log.innerHTML = "";
        appendMessage("system", "Demo reimpostata: sessione e mock server azzerati. Scrivi una nuova richiesta per iniziare.");
        setBusy(false);
        resetBtn.disabled = false;
      }
    });

    async function checkFakeLlmMode() {
      try {
        const res = await fetch(BACKEND + "/health");
        if (!res.ok) return;
        const data = await res.json();
        if (data.fake_llm_enabled) {
          fakeBanner.classList.add("visible");
          appendMessage("system", "Modalità demo senza LLM reale: le risposte sono simulate (FAKE_LLM=1).");
        }
      } catch (err) {
        // /health non raggiungibile: nessun avviso, il resto della UI gestira' l'errore al primo invio.
      }
    }

    appendMessage("system", "Sessione avviata. Scrivi una richiesta in linguaggio naturale per iniziare.");
    checkFakeLlmMode();
  </script>
</body>

</html>
